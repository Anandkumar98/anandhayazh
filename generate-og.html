<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generate OG Preview Images</title>
    <link href="https://fonts.googleapis.com/css2?family=Engagement&family=Corinthia:wght@400;700&family=Kavivanar&family=Great+Vibes&family=Playfair+Display:wght@400;600;700&family=Lato:wght@300;400;700&family=Noto+Sans+Tamil:wght@300;400;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Lato', sans-serif; background: #0d2b42; color: #dceef5; text-align: center; padding: 40px 20px; }
        h1 { margin-bottom: 10px; color: #8eddd6; }
        p { color: #aaa; margin-bottom: 30px; }
        .preview { margin: 20px auto; border: 2px solid #3cbbb1; border-radius: 12px; overflow: hidden; max-width: 600px; }
        .preview img { width: 100%; display: block; }
        .preview-label { padding: 10px; font-size: 14px; background: rgba(60,187,177,0.1); }
        button { background: linear-gradient(135deg, #3cbbb1, #2a9d94); color: #fff; border: none; padding: 14px 32px; border-radius: 50px; font-size: 16px; cursor: pointer; margin: 10px; font-weight: 600; }
        button:hover { transform: scale(1.05); }
        .status { margin-top: 20px; color: #3cbbb1; font-style: italic; }
        canvas { display: none; }
    </style>
</head>
<body>
    <h1>OG Preview Image Generator</h1>
    <p>Click the button below to generate and download both English & Tamil OG preview images.<br>
       Then place <code>og-en.png</code> and <code>og-ta.png</code> in the project root and push to GitHub.</p>
    
    <button onclick="generateBoth()">Generate & Download Both Images</button>
    
    <div id="status" class="status"></div>
    
    <div id="previews"></div>
    
    <canvas id="ogCanvas"></canvas>

    <script>
    // Shared drawing helpers
    function roundRect(ctx, x, y, w, h, r) {
        ctx.beginPath();
        ctx.moveTo(x + r, y);
        ctx.lineTo(x + w - r, y);
        ctx.quadraticCurveTo(x + w, y, x + w, y + r);
        ctx.lineTo(x + w, y + h - r);
        ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        ctx.lineTo(x + r, y + h);
        ctx.quadraticCurveTo(x, y + h, x, y + h - r);
        ctx.lineTo(x, y + r);
        ctx.quadraticCurveTo(x, y, x + r, y);
        ctx.closePath();
    }

    function drawRadialGlow(ctx, x, y, radius, color) {
        const grad = ctx.createRadialGradient(x, y, 0, x, y, radius);
        grad.addColorStop(0, color);
        grad.addColorStop(1, 'transparent');
        ctx.fillStyle = grad;
        ctx.fillRect(x - radius, y - radius, radius * 2, radius * 2);
    }

    function drawCentered(ctx, W, text, y, font, color, maxWidth) {
        ctx.font = font;
        ctx.fillStyle = color;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        if (maxWidth) {
            const measured = ctx.measureText(text).width;
            if (measured > maxWidth) {
                ctx.save();
                ctx.scale(maxWidth / measured, 1);
                ctx.fillText(text, (W / 2) * (measured / maxWidth), y);
                ctx.restore();
                return;
            }
        }
        ctx.fillText(text, W / 2, y);
    }

    function drawDecorativeLine(ctx, W, y) {
        const lineW = 180;
        const grad = ctx.createLinearGradient(W/2 - lineW, y, W/2 + lineW, y);
        grad.addColorStop(0, 'transparent');
        grad.addColorStop(0.3, 'rgba(60, 187, 177, 0.5)');
        grad.addColorStop(0.5, 'rgba(60, 187, 177, 0.7)');
        grad.addColorStop(0.7, 'rgba(60, 187, 177, 0.5)');
        grad.addColorStop(1, 'transparent');
        ctx.strokeStyle = grad;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(W/2 - lineW, y);
        ctx.lineTo(W/2 + lineW, y);
        ctx.stroke();
        ctx.fillStyle = 'rgba(60, 187, 177, 0.6)';
        ctx.beginPath();
        ctx.arc(W/2, y, 2, 0, Math.PI * 2);
        ctx.fill();
    }

    function drawAMMonogram(ctx, cx, cy, scale) {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.scale(scale, scale);

        ctx.strokeStyle = 'rgba(60,187,177,0.35)';
        ctx.lineWidth = 1;
        ctx.setLineDash([6, 5]);
        ctx.beginPath();
        ctx.arc(0, 0, 55, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.strokeStyle = 'rgba(60,187,177,0.5)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(0, 0, 45, 0, Math.PI * 2);
        ctx.stroke();

        // Cardinal dots
        [[0, -55], [55, 0], [0, 55], [-55, 0]].forEach(([dx, dy]) => {
            ctx.beginPath();
            ctx.arc(dx, dy, 2, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(60,187,177,0.5)';
            ctx.fill();
        });

        ctx.shadowColor = 'rgba(60,187,177,0.3)';
        ctx.shadowBlur = 6;
        ctx.font = '52px "Engagement", cursive';
        ctx.fillStyle = '#8eddd6';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('AM', 0, 3);
        ctx.shadowBlur = 0;

        ctx.restore();
    }

    function generateOGImage(isTamil) {
        const canvas = document.getElementById('ogCanvas');
        const ctx = canvas.getContext('2d');
        const W = 1200;
        const H = 630;
        canvas.width = W;
        canvas.height = H;

        // Background gradient
        const bgGrad = ctx.createLinearGradient(0, 0, W, H);
        bgGrad.addColorStop(0, '#091e30');
        bgGrad.addColorStop(0.3, '#0d2b42');
        bgGrad.addColorStop(0.5, '#1a5276');
        bgGrad.addColorStop(0.7, '#2e7db5');
        bgGrad.addColorStop(1, '#091e30');
        ctx.fillStyle = bgGrad;
        ctx.fillRect(0, 0, W, H);

        // Radial glows
        drawRadialGlow(ctx, W * 0.15, H * 0.3, 200, 'rgba(60, 187, 177, 0.05)');
        drawRadialGlow(ctx, W * 0.85, H * 0.6, 200, 'rgba(60, 187, 177, 0.04)');
        drawRadialGlow(ctx, W * 0.5, H * 0.5, 300, 'rgba(60, 187, 177, 0.03)');

        // Dot pattern
        ctx.fillStyle = 'rgba(60, 187, 177, 0.025)';
        for (let i = 0; i < W; i += 25) {
            for (let j = 0; j < H; j += 25) {
                ctx.beginPath();
                ctx.arc(i, j, 0.8, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // Outer border
        ctx.strokeStyle = '#3cbbb1';
        ctx.lineWidth = 2.5;
        roundRect(ctx, 20, 20, W - 40, H - 40, 16);
        ctx.stroke();

        // Inner border
        ctx.strokeStyle = 'rgba(60, 187, 177, 0.25)';
        ctx.lineWidth = 0.8;
        roundRect(ctx, 32, 32, W - 64, H - 64, 12);
        ctx.stroke();

        // Corner dots
        [[42, 42], [W - 42, 42], [42, H - 42], [W - 42, H - 42]].forEach(([cx, cy]) => {
            ctx.fillStyle = 'rgba(60, 187, 177, 0.5)';
            ctx.beginPath();
            ctx.arc(cx, cy, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = 'rgba(60, 187, 177, 0.25)';
            ctx.lineWidth = 0.8;
            ctx.beginPath();
            ctx.arc(cx, cy, 7, 0, Math.PI * 2);
            ctx.stroke();
        });

        // Left side: Monogram + Label
        drawAMMonogram(ctx, 160, H / 2 - 30, 1.0);

        // "Wedding Invitation" below monogram
        const invLabel = isTamil ? 'திருமண அழைப்பிதழ்' : 'WEDDING INVITATION';
        const invFont = isTamil ? '18px "Kavivanar", "Noto Sans Tamil", sans-serif' : '13px "Lato", sans-serif';
        ctx.font = invFont;
        ctx.fillStyle = '#8eddd6';
        ctx.textAlign = 'center';
        ctx.letterSpacing = isTamil ? '0px' : '3px';
        ctx.fillText(invLabel, 160, H / 2 + 60);

        // Vertical decorative line separator
        const sepX = 310;
        const lineGrad = ctx.createLinearGradient(sepX, 60, sepX, H - 60);
        lineGrad.addColorStop(0, 'transparent');
        lineGrad.addColorStop(0.3, 'rgba(60, 187, 177, 0.4)');
        lineGrad.addColorStop(0.5, 'rgba(60, 187, 177, 0.6)');
        lineGrad.addColorStop(0.7, 'rgba(60, 187, 177, 0.4)');
        lineGrad.addColorStop(1, 'transparent');
        ctx.strokeStyle = lineGrad;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(sepX, 60);
        ctx.lineTo(sepX, H - 60);
        ctx.stroke();

        // Dot on separator center
        ctx.fillStyle = 'rgba(60, 187, 177, 0.5)';
        ctx.beginPath();
        ctx.arc(sepX, H / 2, 3, 0, Math.PI * 2);
        ctx.fill();

        // Right side: Content
        const contentCenterX = (sepX + W) / 2;
        const contentW = W - sepX - 80;

        // Tagline
        const tagline = isTamil ? 'தங்கள் குடும்பத்தினருடன் சேர்ந்து' : 'Together with their family,';
        const tagFont = isTamil ? 'italic 17px "Kavivanar", "Noto Sans Tamil", sans-serif' : 'italic 16px "Cormorant Garamond", serif';
        ctx.font = tagFont;
        ctx.fillStyle = 'rgba(142, 221, 214, 0.75)';
        ctx.textAlign = 'center';
        ctx.fillText(tagline, contentCenterX, 85);

        // Groom name
        const groomName = isTamil ? 'Er. J. ஆனந்தகுமார், B.Tech' : 'Er. J. Anandkumar, B.Tech';
        const nameFont = isTamil ? 'bold 32px "Kavivanar", "Noto Sans Tamil", sans-serif' : '42px "Corinthia", "Great Vibes", cursive';
        ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
        ctx.shadowBlur = 10;
        drawCentered(ctx, W, groomName, 148, nameFont, '#ffffff', contentW);
        ctx.textAlign = 'center'; // reset
        ctx.shadowBlur = 0;

        // Groom sub
        if (isTamil) {
            ctx.font = 'italic 14px "Kavivanar", "Noto Sans Tamil", sans-serif';
            ctx.fillStyle = '#8eddd6';
            ctx.fillText('திரு. S. ஜோதிமணி & திருமதி. சந்ரா ஜோதிமணி அவர்களின் மகன்', contentCenterX, 190);
        } else {
            ctx.font = 'italic 14px "Cormorant Garamond", serif';
            ctx.fillStyle = '#8eddd6';
            ctx.fillText('S/o Mr. S. Jothimani & Mrs. Chandra Jothimani', contentCenterX, 190);
        }

        // Ampersand
        ctx.shadowColor = 'rgba(60, 187, 177, 0.4)';
        ctx.shadowBlur = 20;
        ctx.font = '44px "Great Vibes", cursive';
        ctx.fillStyle = '#3cbbb1';
        ctx.fillText('&', contentCenterX, 248);
        ctx.shadowBlur = 0;

        // Bride name
        const brideName = isTamil ? 'Dr. S.A. மணிமொழி @ யாழினி, B.S.M.S.' : 'Dr. S.A. Manimozhi @ Yazhini, B.S.M.S.';
        drawCentered(ctx, W, brideName, 320, nameFont, '#ffffff', contentW);
        ctx.textAlign = 'center';
        ctx.shadowBlur = 0;

        // Bride sub
        if (isTamil) {
            ctx.font = 'italic 14px "Kavivanar", "Noto Sans Tamil", sans-serif';
            ctx.fillStyle = '#8eddd6';
            ctx.fillText('திரு. P. சரவணன் & திருமதி. அஞ்சுகம் சரவணன் அவர்களின் மகள்', contentCenterX, 362);
        } else {
            ctx.font = 'italic 14px "Cormorant Garamond", serif';
            ctx.fillStyle = '#8eddd6';
            ctx.fillText('D/o Mr. P. Saravanan & Mrs. Anjukam Saravanan', contentCenterX, 362);
        }

        // Decorative line
        drawDecorativeLine(ctx, W, 400);

        // Event boxes (side by side)
        const boxW = (contentW - 30) / 2;
        const boxH = 120;
        const boxY = 425;
        const box1X = sepX + 40;
        const box2X = box1X + boxW + 30;

        // Reception box
        const boxGrad1 = ctx.createLinearGradient(box1X, boxY, box1X + boxW, boxY + boxH);
        boxGrad1.addColorStop(0, 'rgba(0, 0, 0, 0.25)');
        boxGrad1.addColorStop(1, 'rgba(0, 0, 0, 0.15)');
        ctx.fillStyle = boxGrad1;
        roundRect(ctx, box1X, boxY, boxW, boxH, 12);
        ctx.fill();
        ctx.strokeStyle = 'rgba(60, 187, 177, 0.2)';
        ctx.lineWidth = 0.8;
        roundRect(ctx, box1X, boxY, boxW, boxH, 12);
        ctx.stroke();

        const b1cx = box1X + boxW / 2;
        const recTitle = isTamil ? 'வரவேற்பு' : 'RECEPTION';
        const recTitleFont = isTamil ? 'bold 16px "Noto Sans Tamil", sans-serif' : 'bold 12px "Lato", sans-serif';
        ctx.font = recTitleFont;
        ctx.fillStyle = '#3cbbb1';
        ctx.fillText(recTitle, b1cx, boxY + 28);

        const recDate = isTamil ? 'ஏப்ரல் 11, 2026' : 'April 11, 2026';
        ctx.font = isTamil ? '18px "Noto Sans Tamil", sans-serif' : '20px "Playfair Display", serif';
        ctx.fillStyle = '#ffffff';
        ctx.fillText(recDate, b1cx, boxY + 58);

        const recDay = isTamil ? 'சனிக்கிழமை' : 'Saturday';
        ctx.font = isTamil ? '13px "Noto Sans Tamil", sans-serif' : 'italic 13px "Cormorant Garamond", serif';
        ctx.fillStyle = '#8eddd6';
        ctx.fillText(recDay, b1cx, boxY + 80);

        const recTime = isTamil ? 'மாலை 7:00 மணி முதல்' : '7:00 PM onwards';
        ctx.font = isTamil ? 'bold 14px "Noto Sans Tamil", sans-serif' : 'bold 14px "Lato", sans-serif';
        ctx.fillStyle = '#ffffff';
        ctx.fillText(recTime, b1cx, boxY + 104);

        // Marriage box
        const boxGrad2 = ctx.createLinearGradient(box2X, boxY, box2X + boxW, boxY + boxH);
        boxGrad2.addColorStop(0, 'rgba(0, 0, 0, 0.25)');
        boxGrad2.addColorStop(1, 'rgba(0, 0, 0, 0.15)');
        ctx.fillStyle = boxGrad2;
        roundRect(ctx, box2X, boxY, boxW, boxH, 12);
        ctx.fill();
        ctx.strokeStyle = 'rgba(60, 187, 177, 0.2)';
        roundRect(ctx, box2X, boxY, boxW, boxH, 12);
        ctx.stroke();

        const b2cx = box2X + boxW / 2;
        const marTitle = isTamil ? 'திருமணம்' : 'MARRIAGE';
        ctx.font = recTitleFont;
        ctx.fillStyle = '#3cbbb1';
        ctx.fillText(marTitle, b2cx, boxY + 28);

        const marDate = isTamil ? 'ஏப்ரல் 12, 2026' : 'April 12, 2026';
        ctx.font = isTamil ? '18px "Noto Sans Tamil", sans-serif' : '20px "Playfair Display", serif';
        ctx.fillStyle = '#ffffff';
        ctx.fillText(marDate, b2cx, boxY + 58);

        const marDay = isTamil ? 'ஞாயிற்றுக்கிழமை' : 'Sunday';
        ctx.font = isTamil ? '13px "Noto Sans Tamil", sans-serif' : 'italic 13px "Cormorant Garamond", serif';
        ctx.fillStyle = '#8eddd6';
        ctx.fillText(marDay, b2cx, boxY + 80);

        const marTime = isTamil ? 'காலை 7:30 - 9:00' : '7:30 AM - 9:00 AM';
        ctx.font = isTamil ? 'bold 14px "Noto Sans Tamil", sans-serif' : 'bold 14px "Lato", sans-serif';
        ctx.fillStyle = '#ffffff';
        ctx.fillText(marTime, b2cx, boxY + 104);

        // Venue footer
        const venueLabel = isTamil ? 'திருமண மண்டபம்:' : 'Venue:';
        ctx.font = isTamil ? '13px "Noto Sans Tamil", sans-serif' : '12px "Lato", sans-serif';
        ctx.fillStyle = '#8eddd6';
        ctx.fillText(venueLabel, contentCenterX - 60, H - 52);

        ctx.font = '18px "Playfair Display", serif';
        ctx.fillStyle = '#ffffff';
        ctx.fillText('Sri Lalita Mahal', contentCenterX + 40, H - 52);

        return canvas;
    }

    function downloadCanvas(canvas, filename) {
        canvas.toBlob(function(blob) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }, 'image/png');
    }

    function showPreview(canvas, label) {
        const container = document.getElementById('previews');
        const div = document.createElement('div');
        div.className = 'preview';
        const img = document.createElement('img');
        img.src = canvas.toDataURL('image/png');
        const lbl = document.createElement('div');
        lbl.className = 'preview-label';
        lbl.textContent = label;
        div.appendChild(img);
        div.appendChild(lbl);
        container.appendChild(div);
    }

    async function generateBoth() {
        const status = document.getElementById('status');
        const previews = document.getElementById('previews');
        previews.innerHTML = '';

        status.textContent = 'Generating English preview...';

        // Small delay to let fonts load
        await new Promise(r => setTimeout(r, 500));

        const canvasEn = generateOGImage(false);
        showPreview(canvasEn, 'og-en.png — English Preview');
        downloadCanvas(canvasEn, 'og-en.png');

        status.textContent = 'Generating Tamil preview...';
        await new Promise(r => setTimeout(r, 300));

        const canvasTa = generateOGImage(true);
        showPreview(canvasTa, 'og-ta.png — Tamil Preview');
        downloadCanvas(canvasTa, 'og-ta.png');

        status.textContent = '✓ Both images downloaded! Move them to the project root folder.';
    }
    </script>
</body>
</html>
